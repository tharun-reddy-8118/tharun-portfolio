<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="100%" stopColor="#05070B" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#89AACC" stop-opacity="0.8" />
      <stop offset="50%" stopColor="#4E85BF" stop-opacity="0.3" />
      <stop offset="100%" stopColor="#1E293B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Metallic Sheen Gradient for TR Monogram -->
    <linearGradient id="tr-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A8C7E8" />
      <stop offset="35%" stopColor="#FFFFFF" />
      <stop offset="70%" stopColor="#6CA3DA" />
      <stop offset="100%" stopColor="#3B71AC" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#4E85BF" stop-opacity="0.35" />
      <stop offset="100%" stopColor="#4E85BF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="32" cy="32" r="28" fill="url(#ambient-glow)" />

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Inner Soft Inset Border -->
  <rect x="4" y="4" width="56" height="56" rx="13" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

  <!-- Monogram T (Bold Architectural) -->
  <path
    d="M15 19H49"
    stroke="url(#tr-metallic)"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <path
    d="M27 19V47"
    stroke="url(#tr-metallic)"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Monogram R (Geometric Interlocking) -->
  <path
    d="M27 28.5H41C45.2 28.5 45.2 38 41 38H27"
    stroke="#FFFFFF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M38.5 38L47 47"
    stroke="url(#tr-metallic)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle Micro Accent Dot -->
  <circle cx="49" cy="19" r="2" fill="#89AACC" />
</svg>